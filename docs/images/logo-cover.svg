    <rect x="0" y="0" width="64" height="64" rx="14" fill="#38566F"/>
    <rect x="16" y="20" width="16" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="16" y="31" width="32" height="5" rx="2.5" fill="#FFFFFF"/>
